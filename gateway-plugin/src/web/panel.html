<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能家居控制面板</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #4CAF50;
            --danger: #ff6b6b;
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #333333;
            --text-light: #666666;
            --border: #e0e0e0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        /* 头部 */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 24px;
            text-align: center;
        }
        .header h1 { font-size: 1.8rem; margin-bottom: 8px; }
        .header .subtitle { opacity: 0.9; font-size: 0.95rem; }

        /* 工具栏 */
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(102,126,234,0.2);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(102,126,234,0.3);
        }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        /* 设备网格 */
        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .device-card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .device-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        /* 设备头部 */
        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .device-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
        }
        .device-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-light);
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--border);
        }
        .status-dot.on {
            background: var(--success);
            box-shadow: 0 0 8px rgba(76,175,80,0.5);
        }

        /* 设备信息 */
        .device-info {
            color: var(--text-light);
            font-size: 0.85rem;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        /* 控制区域 */
        .device-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--border);
            border-radius: 26px;
            transition: 0.3s;
        }
        .slider:before {
            content: "";
            position: absolute;
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }
        input:checked + .slider { background: var(--success); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* 亮度滑块 */
        .brightness-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brightness-row label {
            min-width: 45px;
            font-size: 0.85rem;
            color: var(--text-light);
        }
        input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: var(--border);
            border-radius: 3px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
        }
        .brightness-value {
            min-width: 35px;
            text-align: right;
            font-size: 0.85rem;
            color: var(--text);
        }

        /* 操作按钮 */
        .device-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-light);
        }
        .btn-outline:hover {
            background: var(--bg);
            color: var(--text);
        }

        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text);
        }
        .discovered-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg);
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .discovered-item .info { flex: 1; }
        .discovered-item .name { font-weight: 500; color: var(--text); }
        .discovered-item .meta { font-size: 0.8rem; color: var(--text-light); }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }

        /* 加载动画 */
        .loading { text-align: center; padding: 20px; color: var(--text-light); }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--primary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 响应式 */
        @media (max-width: 600px) {
            .devices-grid { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏠 智能家居控制面板</h1>
            <p class="subtitle" id="status-text">已连接 0 个设备</p>
        </div>

        <div class="toolbar">
            <button class="btn btn-primary" onclick="discoverDevices()">🔍 发现新设备</button>
            <button class="btn btn-primary" onclick="syncDevices()">🔄 同步状态</button>
            <button class="btn btn-success" onclick="allOn()">💡 全部打开</button>
            <button class="btn btn-danger" onclick="allOff()">⚡ 全部关闭</button>
        </div>

        <div class="devices-grid" id="devices-container">
            <div class="loading"><span class="spinner"></span>加载中...</div>
        </div>
    </div>

    <!-- 发现设备弹窗 -->
    <div class="modal" id="discover-modal">
        <div class="modal-content">
            <div class="modal-header">发现新设备</div>
            <div id="discovered-list">
                <div class="loading"><span class="spinner"></span>扫描中...</div>
            </div>
            <button class="btn btn-outline" style="width:100%;margin-top:16px;" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <script>
        const API_BASE = '/api/smarthome';
        let devices = {};

        async function loadDevices() {
            try {
                const resp = await fetch(`${API_BASE}/devices`);
                const data = await resp.json();
                devices = data.devices || {};
                renderDevices();
                updateStatus();
            } catch (e) {
                console.error('加载失败:', e);
                document.getElementById('devices-container').innerHTML =
                    '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败，请检查网络</p></div>';
            }
        }

        function renderDevices() {
            const container = document.getElementById('devices-container');
            const list = Object.values(devices);

            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">🏠</div><p>暂无设备</p><p style="margin-top:8px;font-size:0.9rem">点击"发现新设备"添加</p></div>';
                return;
            }

            container.innerHTML = list.map(d => `
                <div class="device-card" data-id="${d.id}">
                    <div class="device-header">
                        <span class="device-name">${d.name}</span>
                        <div class="device-status">
                            <span class="status-dot ${d.state ? 'on' : ''}"></span>
                            <span>${d.state ? '开启' : '关闭'}</span>
                        </div>
                    </div>
                    <div class="device-info">
                        <div>📍 ${d.ip}</div>
                        <div>型号: ${d.type} · 固件: v${d.version}</div>
                    </div>
                    <div class="device-controls">
                        <div class="switch-row">
                            <span>电源</span>
                            <label class="switch">
                                <input type="checkbox" ${d.state ? 'checked' : ''} onchange="toggle('${d.id}', this.checked)">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="brightness-row">
                            <label>亮度</label>
                            <input type="range" min="0" max="100" value="${d.brightness}" onchange="brightness('${d.id}', this.value)">
                            <span class="brightness-value">${d.brightness}%</span>
                        </div>
                    </div>
                    <div class="device-actions">
                        <button class="btn btn-sm btn-outline" onclick="rename('${d.id}')">重命名</button>
                        <button class="btn btn-sm btn-outline" onclick="remove('${d.id}')">移除</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStatus() {
            const list = Object.values(devices);
            const count = list.length;
            const onCount = list.filter(d => d.state).length;
            document.getElementById('status-text').textContent = `已连接 ${count} 个设备，${onCount} 个开启`;
        }

        async function toggle(id, state) {
            try {
                await fetch(`${API_BASE}/control/${id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ state })
                });
                devices[id].state = state;
                renderDevices();
            } catch (e) {
                alert('操作失败');
            }
        }

        async function brightness(id, value) {
            try {
                await fetch(`${API_BASE}/control/${id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ brightness: parseInt(value) })
                });
                devices[id].brightness = parseInt(value);
                renderDevices();
            } catch (e) {
                alert('操作失败');
            }
        }

        async function allOn() {
            await fetch(`${API_BASE}/control/all`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ state: true })
            });
            loadDevices();
        }

        async function allOff() {
            await fetch(`${API_BASE}/control/all`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ state: false })
            });
            loadDevices();
        }

        async function syncDevices() {
            await fetch(`${API_BASE}/sync`, { method: 'POST' });
            loadDevices();
        }

        async function discoverDevices() {
            document.getElementById('discover-modal').classList.add('active');
            document.getElementById('discovered-list').innerHTML = '<div class="loading"><span class="spinner"></span>扫描中...</div>';

            try {
                const resp = await fetch(`${API_BASE}/discover`, { method: 'POST' });
                const data = await resp.json();
                renderDiscovered(data.devices || []);
            } catch (e) {
                document.getElementById('discovered-list').innerHTML = '<div class="empty-state"><p>扫描失败</p></div>';
            }
        }

        function renderDiscovered(list) {
            const container = document.getElementById('discovered-list');
            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>未发现新设备</p></div>';
                return;
            }
            container.innerHTML = list.map(d => `
                <div class="discovered-item">
                    <div class="info">
                        <div class="name">${d.name}</div>
                        <div class="meta">${d.ip} · ${d.type}</div>
                    </div>
                    <button class="btn btn-sm btn-primary" onclick="addDevice('${d.id}', '${d.ip}', '${d.name}', '${d.type}')">添加</button>
                </div>
            `).join('');
        }

        async function addDevice(id, ip, name, type) {
            await fetch(`${API_BASE}/devices`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, ip, name, type })
            });
            closeModal();
            loadDevices();
        }

        async function rename(id) {
            const name = prompt('请输入新名称:', devices[id].name);
            if (name) {
                await fetch(`${API_BASE}/control/${id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                devices[id].name = name;
                renderDevices();
            }
        }

        async function remove(id) {
            if (confirm('确定移除该设备？')) {
                await fetch(`${API_BASE}/devices/${id}`, { method: 'DELETE' });
                loadDevices();
            }
        }

        function closeModal() {
            document.getElementById('discover-modal').classList.remove('active');
        }

        // 初始化
        loadDevices();
        setInterval(syncDevices, 30000);
    </script>
</body>
</html>
