<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能家居 - OpenClaw Gateway</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #4CAF50;
            --danger: #ff6b6b;
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #333333;
            --text-light: #666666;
            --border: #e0e0e0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        /* 顶部导航栏 */
        .top-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .top-nav a {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .top-nav a:hover { text-decoration: underline; }
        .top-nav .title {
            flex: 1;
            font-weight: 600;
            color: var(--text);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-light);
        }
        .user-info .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        /* 认证提示 */
        .auth-required {
            text-align: center;
            padding: 60px 20px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .auth-required h2 { color: var(--text); margin-bottom: 12px; }
        .auth-required p { color: var(--text-light); margin-bottom: 20px; }
        .auth-required .btn {
            display: inline-block;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
        }
        .auth-required .btn:hover {
            background: var(--primary-dark);
        }

        /* 头部 */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            text-align: center;
        }
        .header h1 { font-size: 1.6rem; margin-bottom: 8px; }
        .header .subtitle { opacity: 0.9; font-size: 0.9rem; }

        /* 工具栏 */
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(102,126,234,0.2);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,0.3); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        /* 设备网格 */
        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .device-card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .device-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .device-name { font-size: 1rem; font-weight: 600; color: var(--text); }
        .device-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            color: var(--text-light);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
        }
        .status-dot.on { background: var(--success); box-shadow: 0 0 6px rgba(76,175,80,0.4); }
        .device-info {
            color: var(--text-light);
            font-size: 0.8rem;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .device-controls { display: flex; flex-direction: column; gap: 10px; }
        .switch-row { display: flex; align-items: center; justify-content: space-between; }
        .switch { position: relative; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--border);
            border-radius: 24px;
            transition: 0.3s;
        }
        .slider:before {
            content: "";
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }
        input:checked + .slider { background: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }

        .brightness-row { display: flex; align-items: center; gap: 8px; }
        .brightness-row label { min-width: 40px; font-size: 0.8rem; color: var(--text-light); }
        input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: var(--border);
            border-radius: 2px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
        }
        .brightness-value { min-width: 32px; text-align: right; font-size: 0.8rem; }
        .device-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-light);
        }
        .btn-outline:hover { background: var(--bg); color: var(--text); }

        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            max-width: 400px;
            width: 90%;
            max-height: 70vh;
            overflow-y: auto;
        }
        .modal-header { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }
        .discovered-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: var(--bg);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .discovered-item .info { flex: 1; }
        .discovered-item .name { font-weight: 500; font-size: 0.9rem; }
        .discovered-item .meta { font-size: 0.75rem; color: var(--text-light); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
        .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
        .loading { text-align: center; padding: 20px; color: var(--text-light); }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--primary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .devices-grid { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <div class="top-nav">
            <a href="/">← 返回 Gateway</a>
            <span class="title">🏠 智能家居</span>
            <div class="user-info" id="user-info" style="display:none;">
                <span class="dot"></span>
                <span id="user-name">已认证</span>
            </div>
        </div>

        <!-- 未认证提示 -->
        <div class="auth-required" id="auth-required" style="display:none;">
            <h2>🔐 需要认证</h2>
            <p>请先登录 Gateway Control UI</p>
            <a href="/" class="btn">前往登录</a>
        </div>

        <!-- 主内容区 -->
        <div id="main-content" style="display:none;">
            <div class="header">
                <h1>智能家居控制面板</h1>
                <p class="subtitle" id="status-text">已连接 0 个设备</p>
            </div>

            <div class="toolbar">
                <button class="btn btn-primary" onclick="discoverDevices()">🔍 发现设备</button>
                <button class="btn btn-primary" onclick="syncDevices()">🔄 同步状态</button>
                <button class="btn btn-success" onclick="allOn()">💡 全部打开</button>
                <button class="btn btn-danger" onclick="allOff()">⚡ 全部关闭</button>
            </div>

            <div class="devices-grid" id="devices-container">
                <div class="loading"><span class="spinner"></span>加载中...</div>
            </div>
        </div>
    </div>

    <!-- 发现设备弹窗 -->
    <div class="modal" id="discover-modal">
        <div class="modal-content">
            <div class="modal-header">发现新设备</div>
            <div id="discovered-list"><div class="loading"><span class="spinner"></span>扫描中...</div></div>
            <button class="btn btn-outline" style="width:100%;margin-top:12px;" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <script>
        const API_BASE = '/api/smarthome';
        const GATEWAY_WS = `ws://${location.host}/ws`;
        let devices = {};
        let gatewaySocket = null;
        let isAuthenticated = false;

        // ========== Gateway 认证检查 ==========
        async function checkGatewayAuth() {
            // 尝试连接 Gateway WebSocket 来验证认证状态
            return new Promise((resolve) => {
                try {
                    const ws = new WebSocket(GATEWAY_WS);

                    ws.onopen = () => {
                        // 发送 ping 验证连接
                        ws.send(JSON.stringify({ method: 'ping', id: 1 }));
                    };

                    ws.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            if (data.id === 1) {
                                isAuthenticated = true;
                                ws.close();
                                resolve(true);
                            }
                        } catch {
                            ws.close();
                            resolve(false);
                        }
                    };

                    ws.onerror = () => {
                        resolve(false);
                    };

                    ws.onclose = (event) => {
                        // 1008 = Policy Violation (认证失败)
                        // 1000 = Normal closure (认证成功)
                        if (event.code === 1008) {
                            resolve(false);
                        }
                    };

                    // 超时
                    setTimeout(() => {
                        if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
                            ws.close();
                        }
                        resolve(isAuthenticated);
                    }, 5000);
                } catch {
                    resolve(false);
                }
            });
        }

        // 从 sessionStorage 获取 token（Control UI 存储的位置）
        function getStoredToken() {
            try {
                const stored = sessionStorage.getItem('openclaw_gateway_auth');
                if (stored) {
                    const auth = JSON.parse(stored);
                    return auth.token;
                }
            } catch {}
            return null;
        }

        // 带 token 的 fetch
        async function authFetch(url, options = {}) {
            const token = getStoredToken();
            const headers = { ...options.headers };
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            return fetch(url, { ...options, headers });
        }

        // ========== 页面初始化 ==========
        async function init() {
            // 检查 Gateway 认证状态
            const authed = await checkGatewayAuth();

            if (authed) {
                document.getElementById('auth-required').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('user-info').style.display = 'flex';
                loadDevices();
            } else {
                document.getElementById('auth-required').style.display = 'block';
                document.getElementById('main-content').style.display = 'none';
            }
        }

        // ========== 设备操作 ==========
        async function loadDevices() {
            try {
                const resp = await authFetch(`${API_BASE}/devices`);
                const data = await resp.json();
                devices = data.devices || {};
                renderDevices();
                updateStatus();
            } catch (e) {
                console.error('加载失败:', e);
                document.getElementById('devices-container').innerHTML =
                    '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败</p></div>';
            }
        }

        function renderDevices() {
            const container = document.getElementById('devices-container');
            const list = Object.values(devices);

            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">🏠</div><p>暂无设备</p><p style="margin-top:6px;font-size:0.85rem">点击"发现设备"添加</p></div>';
                return;
            }

            container.innerHTML = list.map(d => `
                <div class="device-card" data-id="${d.id}">
                    <div class="device-header">
                        <span class="device-name">${d.name}</span>
                        <div class="device-status">
                            <span class="status-dot ${d.state ? 'on' : ''}"></span>
                            <span>${d.state ? '开' : '关'}</span>
                        </div>
                    </div>
                    <div class="device-info">
                        <div>📍 ${d.ip}</div>
                        <div>${d.type} · v${d.version}</div>
                    </div>
                    <div class="device-controls">
                        <div class="switch-row">
                            <span>电源</span>
                            <label class="switch">
                                <input type="checkbox" ${d.state ? 'checked' : ''} onchange="toggle('${d.id}', this.checked)">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="brightness-row">
                            <label>亮度</label>
                            <input type="range" min="0" max="100" value="${d.brightness}" onchange="brightness('${d.id}', this.value)">
                            <span class="brightness-value">${d.brightness}%</span>
                        </div>
                    </div>
                    <div class="device-actions">
                        <button class="btn btn-sm btn-outline" onclick="rename('${d.id}')">重命名</button>
                        <button class="btn btn-sm btn-outline" onclick="remove('${d.id}')">移除</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStatus() {
            const list = Object.values(devices);
            const count = list.length;
            const onCount = list.filter(d => d.state).length;
            document.getElementById('status-text').textContent = `已连接 ${count} 个设备，${onCount} 个开启`;
        }

        async function toggle(id, state) {
            await authFetch(`${API_BASE}/control/${id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ state })
            });
            devices[id].state = state;
            renderDevices();
        }

        async function brightness(id, value) {
            await authFetch(`${API_BASE}/control/${id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ brightness: parseInt(value) })
            });
            devices[id].brightness = parseInt(value);
            renderDevices();
        }

        async function allOn() {
            await authFetch(`${API_BASE}/control/all`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ state: true })
            });
            loadDevices();
        }

        async function allOff() {
            await authFetch(`${API_BASE}/control/all`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ state: false })
            });
            loadDevices();
        }

        async function syncDevices() {
            await authFetch(`${API_BASE}/sync`, { method: 'POST' });
            loadDevices();
        }

        async function discoverDevices() {
            document.getElementById('discover-modal').classList.add('active');
            document.getElementById('discovered-list').innerHTML = '<div class="loading"><span class="spinner"></span>扫描中...</div>';
            try {
                const resp = await authFetch(`${API_BASE}/discover`, { method: 'POST' });
                const data = await resp.json();
                renderDiscovered(data.devices || []);
            } catch {
                document.getElementById('discovered-list').innerHTML = '<div class="empty-state"><p>扫描失败</p></div>';
            }
        }

        function renderDiscovered(list) {
            const container = document.getElementById('discovered-list');
            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>未发现新设备</p></div>';
                return;
            }
            container.innerHTML = list.map(d => `
                <div class="discovered-item">
                    <div class="info">
                        <div class="name">${d.name}</div>
                        <div class="meta">${d.ip} · ${d.type}</div>
                    </div>
                    <button class="btn btn-sm btn-primary" onclick="addDevice('${d.id}', '${d.ip}', '${d.name}', '${d.type}')">添加</button>
                </div>
            `).join('');
        }

        async function addDevice(id, ip, name, type) {
            await authFetch(`${API_BASE}/devices`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, ip, name, type })
            });
            closeModal();
            loadDevices();
        }

        async function rename(id) {
            const name = prompt('新名称:', devices[id].name);
            if (name) {
                await authFetch(`${API_BASE}/control/${id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                devices[id].name = name;
                renderDevices();
            }
        }

        async function remove(id) {
            if (confirm('确定移除该设备？')) {
                await authFetch(`${API_BASE}/devices/${id}`, { method: 'DELETE' });
                loadDevices();
            }
        }

        function closeModal() {
            document.getElementById('discover-modal').classList.remove('active');
        }

        // 初始化
        init();
        // 定时同步
        setInterval(() => { if (isAuthenticated) syncDevices(); }, 30000);
    </script>
</body>
</html>
