# 手机配网界面

使用手机浏览器访问设备配网页面。

## 使用流程

1. 设备上电后进入配网模式
2. 手机 WiFi 设置中连接 "SmartHome-XXXXXX"
3. 手机浏览器会自动弹出配网页面（或手动访问 192.168.4.1）
4. 选择家庭 WiFi 并输入密码
5. 可选：设置静态 IP
6. 点击"连接"，设备将重启

## 配网页面

```html
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHome 设备配网</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; }
        h1 { color: #667eea; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 15px; background: #667eea; color: white; border: none; border-radius: 4px; font-size: 16px; }
        .optional { color: #666; font-size: 12px; }
        #status { margin-top: 20px; padding: 10px; text-align: center; display: none; }
    </style>
</head>
<body>
    <h1>🏠 设备配网</h1>
    <p>请选择您的 WiFi 网络并输入密码</p>
    
    <div class="form-group">
        <label>WiFi 网络</label>
        <select id="ssid">
            <option value="">扫描中...</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>WiFi 密码</label>
        <input type="password" id="password" placeholder="请输入密码">
    </div>
    
    <div class="form-group">
        <label>设备名称（可选）</label>
        <input type="text" id="name" placeholder="如：客厅灯">
    </div>
    
    <details>
        <summary>高级设置（静态 IP）</summary>
        <div class="form-group">
            <label class="optional">IP 地址（可选）</label>
            <input type="text" id="ip" placeholder="192.168.1.100">
        </div>
        <div class="form-group">
            <label class="optional">网关（可选）</label>
            <input type="text" id="gateway" placeholder="192.168.1.1">
        </div>
    </details>
    
    <button onclick="connect()">连接 WiFi</button>
    
    <div id="status"></div>
    
    <script>
        // 扫描 WiFi
        async function scanWiFi() {
            try {
                const response = await fetch('/api/scan');
                const data = await response.json();
                const select = document.getElementById('ssid');
                select.innerHTML = data.networks
                    .sort((a, b) => b.rssi - a.rssi)
                    .map(n => `<option value="${n.ssid}">${n.ssid} (${n.rssi}dBm)</option>`)
                    .join('');
            } catch (e) {
                setTimeout(scanWiFi, 1000);
            }
        }
        
        // 连接 WiFi
        async function connect() {
            const config = {
                ssid: document.getElementById('ssid').value,
                password: document.getElementById('password').value,
                name: document.getElementById('name').value
            };
            
            const ip = document.getElementById('ip').value;
            if (ip) {
                config.ip = ip;
                config.gateway = document.getElementById('gateway').value || ip.split('.').slice(0, 3).join('.') + '.1';
                config.subnet = '255.255.255.0';
            }
            
            const status = document.getElementById('status');
            status.style.display = 'block';
            status.innerHTML = '正在连接...';
            
            try {
                await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(config)
                });
                
                status.innerHTML = '✅ 配置成功！设备正在重启...<br>请重新连接您的家庭 WiFi。';
            } catch (e) {
                status.innerHTML = '✅ 配置已保存，设备正在重启...<br>请重新连接您的家庭 WiFi。';
            }
        }
        
        // 初始化
        scanWiFi();
    </script>
</body>
</html>
```
