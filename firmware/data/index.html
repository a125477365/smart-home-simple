<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHome 设备配网</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
            background: #f5f5f5;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #667eea;
            margin-top: 0;
            font-size: 24px;
        }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #333;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }
        button:active { transform: translateY(0); }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .optional { color: #888; font-size: 13px; }
        details {
            margin: 16px 0;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        summary { cursor: pointer; color: #667eea; }
        #status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        #status.success { background: #e8f5e9; color: #2e7d32; }
        #status.error { background: #ffebee; color: #c62828; }
        #status.info { background: #e3f2fd; color: #1565c0; }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #667eea;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>🏠 设备配网</h1>
        <p>请选择您的 WiFi 网络并输入密码</p>
        
        <div class="form-group">
            <label>WiFi 网络</label>
            <select id="ssid">
                <option value="">扫描中...</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>WiFi 密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>
        
        <div class="form-group">
            <label>设备名称（可选）</label>
            <input type="text" id="devicename" placeholder="如：客厅灯">
        </div>
        
        <details>
            <summary>高级设置（静态 IP）</summary>
            <div class="form-group">
                <label class="optional">IP 地址</label>
                <input type="text" id="ip" placeholder="192.168.1.100">
            </div>
            <div class="form-group">
                <label class="optional">网关</label>
                <input type="text" id="gateway" placeholder="192.168.1.1">
            </div>
        </details>
        
        <button id="connectBtn" onclick="connect()">连接 WiFi</button>
        
        <div id="status"></div>
    </div>
    
    <script>
        // 扫描 WiFi
        async function scanWiFi() {
            try {
                const response = await fetch('/api/scan');
                const data = await response.json();
                
                if (data.status === 'scanning') {
                    setTimeout(scanWiFi, 1000);
                    return;
                }
                
                const select = document.getElementById('ssid');
                if (data.networks && data.networks.length > 0) {
                    select.innerHTML = data.networks
                        .sort((a, b) => b.rssi - a.rssi)
                        .map(n => `<option value="${n.ssid}">${n.ssid} (${n.rssi}dBm)${n.encrypted ? ' 🔒' : ''}</option>`)
                        .join('');
                } else {
                    select.innerHTML = '<option value="">未找到网络</option>';
                }
            } catch (e) {
                console.error('Scan failed:', e);
                setTimeout(scanWiFi, 2000);
            }
        }
        
        // 连接 WiFi
        async function connect() {
            const ssid = document.getElementById('ssid').value;
            const password = document.getElementById('password').value;
            
            if (!ssid) {
                showStatus('请选择 WiFi 网络', 'error');
                return;
            }
            
            const config = {
                ssid: ssid,
                password: password,
                name: document.getElementById('devicename').value || ''
            };
            
            // 静态 IP 配置
            const ip = document.getElementById('ip').value;
            if (ip) {
                config.ip = ip;
                config.gateway = document.getElementById('gateway').value || ip.split('.').slice(0, 3).join('.') + '.1';
                config.subnet = '255.255.255.0';
            }
            
            const btn = document.getElementById('connectBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>连接中...';
            
            showStatus('正在保存配置...', 'info');
            
            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(config)
                });
                
                if (response.ok) {
                    showStatus('✅ 配置成功！设备正在重启...<br>请重新连接您的家庭 WiFi，然后访问 Gateway 管理界面。', 'success');
                } else {
                    showStatus('❌ 配置失败，请重试', 'error');
                    btn.disabled = false;
                    btn.textContent = '连接 WiFi';
                }
            } catch (e) {
                // 请求失败通常意味着设备已开始重启
                showStatus('✅ 配置已保存，设备正在重启...<br>请重新连接您的家庭 WiFi。', 'success');
            }
        }
        
        function showStatus(msg, type) {
            const status = document.getElementById('status');
            status.innerHTML = msg;
            status.className = type;
            status.style.display = 'block';
        }
        
        // 页面加载时扫描 WiFi
        scanWiFi();
    </script>
</body>
</html>
